version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm install @rollup/rollup-linux-x64-gnu --no-save
        - cp .env client/.env || echo "No .env file to copy"
    build:
      commands:
        - npx vite build
  artifacts:
    baseDirectory: dist/public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - client/node_modules/**/*