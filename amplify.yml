version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm install @rollup/rollup-linux-x64-gnu --no-save
        - cp .env client/.env || echo "No .env file to copy"
    build:
      commands:
        - VITE_STRAPI_URL=https://cms.compleohealth.com VITE_GA_MEASUREMENT_ID=G-4C9XEXTQ93 VITE_CONTACT_API_ENDPOINT=https://4xccwo5gph.execute-api.eu-west-2.amazonaws.com/prod/contact npx vite build
  artifacts:
    baseDirectory: dist/public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - client/node_modules/**/*